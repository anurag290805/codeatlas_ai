<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">CodeAtlas AI repository intelligence pipeline</title>
  <desc id="desc">A GitHub repository flows through parsing and indexing into a central code intelligence layer, which connects to search, dependency graph, and AI chat.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11121a"/>
      <stop offset="1" stop-color="#191827"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9" stop-opacity=".85"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity=".85"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#050509" flood-opacity=".45"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1200" height="480" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="478" rx="27" fill="url(#grid)" stroke="#ffffff" stroke-opacity=".1"/>

  <!-- Quiet orbital traces keep the composition technical without becoming decorative noise. -->
  <path d="M54 382C244 455 418 452 579 393C748 331 889 357 1145 112" fill="none" stroke="#a78bfa" stroke-opacity=".11" stroke-width="1"/>
  <path d="M95 78C289 12 420 44 563 101C735 169 921 157 1114 73" fill="none" stroke="#67e8f9" stroke-opacity=".09" stroke-width="1"/>

  <!-- Repository input -->
  <g transform="translate(54 105)" filter="url(#shadow)">
    <rect width="258" height="218" rx="16" fill="#171923" stroke="#c4b5fd" stroke-opacity=".34"/>
    <rect width="258" height="38" rx="16" fill="#242238"/>
    <path d="M0 38h258" stroke="#ffffff" stroke-opacity=".08"/>
    <circle cx="20" cy="19" r="4" fill="#8b5cf6"/>
    <text x="34" y="24" fill="#ddd6fe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.4">GITHUB REPOSITORY</text>
    <g transform="translate(20 62)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 8h13l7 7h34v84H0z" fill="#2b2840" stroke="#a78bfa" stroke-opacity=".7"/>
      <path d="M20 15V8h13l7 7" stroke="#a78bfa" stroke-opacity=".7"/>
      <path d="M72 14h124M72 34h102M72 54h116M72 74h87" stroke="#e9d5ff" stroke-opacity=".54" stroke-width="2"/>
      <path d="M72 100h47" stroke="#67e8f9" stroke-opacity=".7" stroke-width="2"/>
      <circle cx="63" cy="14" r="3" fill="#67e8f9" stroke="none"/><circle cx="63" cy="34" r="3" fill="#a78bfa" stroke="none"/><circle cx="63" cy="54" r="3" fill="#a78bfa" stroke="none"/>
    </g>
    <text x="20" y="193" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">src/  api/  core/  components/</text>
  </g>

  <!-- Input to indexer -->
  <path d="M312 214H386" stroke="url(#cyan)" stroke-width="2" stroke-dasharray="5 7"/>
  <circle cx="352" cy="214" r="4" fill="#67e8f9" filter="url(#softGlow)"/>

  <!-- Indexing rail -->
  <g transform="translate(386 150)">
    <rect width="164" height="128" rx="15" fill="#191a27" stroke="#67e8f9" stroke-opacity=".45"/>
    <text x="22" y="35" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">INDEXER</text>
    <path d="M22 58h120M22 78h86M22 98h128" stroke="#dbeafe" stroke-opacity=".33" stroke-width="3" stroke-linecap="round"/>
    <path d="M120 78h22M106 98h36" stroke="#c4b5fd" stroke-opacity=".78" stroke-width="3" stroke-linecap="round"/>
    <circle cx="135" cy="35" r="6" fill="#67e8f9" fill-opacity=".18" stroke="#67e8f9" stroke-opacity=".65"/>
  </g>

  <!-- Central intelligence layer -->
  <path d="M550 214H610" stroke="url(#violet)" stroke-width="3"/>
  <g transform="translate(610 70)" filter="url(#shadow)">
    <rect width="342" height="288" rx="20" fill="#1d1a2b" stroke="url(#violet)" stroke-opacity=".75"/>
    <rect x="1" y="1" width="340" height="286" rx="19" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="28" y="42" fill="#f5f3ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650" letter-spacing=".2">CODE INTELLIGENCE</text>
    <text x="28" y="64" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">structure · meaning · relationships</text>

    <!-- Relationship map -->
    <g transform="translate(28 90)" fill="none" stroke-linecap="round">
      <path d="M26 58L95 22L164 62L233 26M95 22l3 92M164 62l-66 52 135-2M233 26l-1 88" stroke="#a78bfa" stroke-opacity=".42" stroke-width="1.5"/>
      <path d="M26 58L98 114L233 114" stroke="#67e8f9" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="4 5"/>
      <circle cx="26" cy="58" r="9" fill="#27233b" stroke="#c4b5fd" stroke-width="2"/>
      <circle cx="95" cy="22" r="7" fill="#8b5cf6" stroke="#ede9fe" stroke-opacity=".8"/>
      <circle cx="164" cy="62" r="10" fill="#27233b" stroke="#67e8f9" stroke-width="2"/>
      <circle cx="233" cy="26" r="7" fill="#8b5cf6" stroke="#ede9fe" stroke-opacity=".8"/>
      <circle cx="98" cy="114" r="8" fill="#27233b" stroke="#67e8f9" stroke-width="2"/>
      <circle cx="233" cy="114" r="9" fill="#27233b" stroke="#c4b5fd" stroke-width="2"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#c4b5fd">
      <text x="38" y="266">symbols</text><text x="119" y="266">imports</text><text x="205" y="266">embeddings</text>
    </g>
    <path d="M28 274h286" stroke="#ffffff" stroke-opacity=".08"/>
  </g>

  <!-- Output branches -->
  <path d="M952 157C1001 157 1008 123 1044 123" fill="none" stroke="#c4b5fd" stroke-opacity=".75" stroke-width="2"/>
  <path d="M952 214H1044" fill="none" stroke="#67e8f9" stroke-opacity=".75" stroke-width="2"/>
  <path d="M952 271C1001 271 1008 305 1044 305" fill="none" stroke="#c4b5fd" stroke-opacity=".75" stroke-width="2"/>
  <circle cx="1014" cy="123" r="4" fill="#c4b5fd"/><circle cx="1014" cy="214" r="4" fill="#67e8f9"/><circle cx="1014" cy="305" r="4" fill="#c4b5fd"/>

  <g transform="translate(1044 92)">
    <rect width="110" height="62" rx="12" fill="#1b1c29" stroke="#c4b5fd" stroke-opacity=".5"/>
    <text x="18" y="27" fill="#f5f3ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">SEARCH</text>
    <path d="M18 42h50" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/><circle cx="83" cy="40" r="7" fill="none" stroke="#67e8f9"/><path d="M88 45l6 6" stroke="#67e8f9" stroke-width="2"/>
  </g>
  <g transform="translate(1044 183)">
    <rect width="110" height="62" rx="12" fill="#1b1c29" stroke="#67e8f9" stroke-opacity=".5"/>
    <text x="18" y="27" fill="#f5f3ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">GRAPH</text>
    <path d="M21 45L47 30l26 15 17-22M47 30v25" fill="none" stroke="#67e8f9" stroke-opacity=".8" stroke-width="1.5"/><circle cx="21" cy="45" r="3" fill="#c4b5fd"/><circle cx="47" cy="30" r="3" fill="#67e8f9"/><circle cx="73" cy="45" r="3" fill="#c4b5fd"/><circle cx="90" cy="23" r="3" fill="#67e8f9"/>
  </g>
  <g transform="translate(1044 274)">
    <rect width="110" height="62" rx="12" fill="#1b1c29" stroke="#c4b5fd" stroke-opacity=".5"/>
    <text x="18" y="27" fill="#f5f3ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">AI CHAT</text>
    <path d="M18 40c0-7 10-11 28-11s28 4 28 11-10 11-28 11c-5 0-9 0-13-1l-10 5 3-9c-5-2-8-4-8-6z" fill="none" stroke="#a78bfa" stroke-width="1.5"/><circle cx="39" cy="40" r="2" fill="#67e8f9"/><circle cx="48" cy="40" r="2" fill="#67e8f9"/><circle cx="57" cy="40" r="2" fill="#67e8f9"/>
  </g>

  <text x="54" y="420" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.8">FROM SOURCE TO UNDERSTANDING</text>
  <text x="1146" y="420" text-anchor="end" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.8">CODEATLAS AI</text>
</svg>
