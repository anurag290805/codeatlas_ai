services:
  - type: web
    name: codeatlas-ai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: WORKSPACE_SESSION_SECRET
        sync: false
      - key: REPOSITORIES_DIR
        value: /tmp/codeatlas-repositories
